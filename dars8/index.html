<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>8-dars: Kartochkalar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="cards">
        <div class="card">
            <img class="card-image" src="./images/course-1.png" alt="Web Dasturlash">
            <div class="card-body">
                <h3 class="card-title">Web Dasturlash</h3>
                <p class="card-text">Zamonaviy frontend kursi. HTML, CSS va amaliyot.</p>
                <div class="card-price">299 000 so'm</div>
                <button class="btn">Batafsil</button>
            </div>
        </div>

        <div class="card">
            <img class="card-image" src="./images/course-2.png" alt="Python asoslari">
            <div class="card-body">
                <h3 class="card-title">Python Asoslari</h3>
                <p class="card-text">Dasturlashga kirish, sintaksis va amaliy loyihalar</p>
                <div class="card-price">249 000 so'm</div>
                <button class="btn">Batafsil</button>
            </div>
        </div>

        <div class="card">
            <img class="card-image" src="./images/course-3.png" alt="C# Backend">
            <div class="card-body">
                <h3 class="card-title">C# Backend</h3>
                <p class="card-text">ASP.NET Core bilan server tomonini o'rganish</p>
                <div class="card-price">329 000 so'm</div>
                <button class="btn">Batafsil</button>
            </div>
        </div>
    </section>

</body>
</html>
